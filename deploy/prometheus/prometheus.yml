global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    env: demo

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: order-api
    metrics_path: /metrics
    static_configs:
      - targets: ["order-api:8081"]
        labels:
          service: order-api

  - job_name: arena
    metrics_path: /healthz
    static_configs:
      - targets: ["arena:8080"]
        labels:
          service: arena
