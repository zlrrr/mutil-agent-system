# IncidentOps Arena — demo stack.
#
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# The `arena` service alone is enough to see the whole flow: it runs the reference
# scenarios from embedded fixture data, offline. The remaining services exist so the
# same scenario can be driven against a live target with faultctl.

name: incidentops-arena

services:
  arena:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: 0.1.0-mvp
    image: incidentops-arena:0.1.0-mvp
    container_name: arena
    ports:
      - "8080:8080"
    environment:
      ARENA_ADDR: ":8080"
      ARENA_STORE: file
      ARENA_DATA: /data
    volumes:
      - arena-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The demo target. faultctl injects and restores its configuration; nothing the
  # arena service does can reach outside the policy-gated executor.
  order-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    image: incidentops-order-api:0.1.0-mvp
    container_name: order-api
    ports:
      - "8081:8081"
    environment:
      ORDER_API_ADDR: ":8081"
      DB_POOL_SIZE: "20"
      RATE_LIMIT_QPS: "500"
      FEATURE_FLAG_SAFE_MODE: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  traffic-generator:
    image: incidentops-order-api:0.1.0-mvp
    container_name: traffic-generator
    command: ["load", "--target", "http://order-api:8081", "--rps", "20"]
    depends_on:
      order-api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    depends_on:
      order-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arena-data:
